environment: development

server:
  port: "19090"
  metrics_port: "19091"
  allowed_origins: "http://localhost:3000,http://localhost:5173"
                                                                                
  expensive_query_concurrency: 2

mysql:
  host: "127.0.0.1"
  port: "13306"
  database: optikk
  user: root
  password: "localdev"                                                            
  max_open_conns: 50
  max_idle_conns: 25

clickhouse:
  host: "127.0.0.1"
  port: "19000"
  database: optikk
  user: default
  password: "localdev"                                                                 
  secure: false
                                                                     
  max_open_conns: 12
  max_idle_conns: 6

                                                                             
                                                                 
alerting:
  kafka:
    enabled: false
    broker_list: "127.0.0.1:9092"
    topic_prefix: optikk.ingest
    consumer_group: optikk-query-alerting
    max_poll_records: 1000

auth:
  jwt_secret: ""                                                  
  access_ttl_ms: 900000
  refresh_ttl_ms: 604800000
  refresh_cookie_name: optikk_refresh
  cookie_domain: ""
  cookie_secure: false
  cookie_same_site: lax

email:
  resend_verification_enabled: false
  resend_api_key: ""
  from: ""
  verify_base_url: "http://localhost:3000/login"

# Public OTLP endpoints shown to users (welcome page, instrumentation docs).
# Defaults (when omitted) are the managed endpoints:
#   public_grpc_endpoint: "ingest.optikk.in:4317"
#   public_http_endpoint: "https://ingest.optikk.in:4318"
# Local ingest listens on 18317 (gRPC) / 18318 (HTTP).
ingestion:
  public_grpc_endpoint: "localhost:18317"
  public_http_endpoint: "http://localhost:18318"

# Billing rates for the usage-cost meter (ingestion overview).
# Defaults (when omitted):
#   gb_price_usd: 0.10            # USD per GB of logs + traces
#   dpm_price_usd: 0.008          # USD per metric datapoint-per-minute
#   monthly_record_commitment: 5000000000
billing:
  gb_price_usd: 0.10
  dpm_price_usd: 0.008
  monthly_record_commitment: 5000000000
