environment: development

server:
  port: "19090"
  allowed_origins: "http://localhost:3000,http://localhost:5173"

mysql:
  host: "127.0.0.1"
  port: "13306"
  database: optikk
  user: root
  password: "" # Use OPTIKK_MYSQL_PASSWORD environment variable
  max_open_conns: 50
  max_idle_conns: 25

clickhouse:
  host: "127.0.0.1"
  port: "19000"
  database: optikk
  user: default
  password: "" # Use OPTIKK_CLICKHOUSE_PASSWORD environment variable
  secure: false

auth:
  jwt_secret: "" # Use OPTIKK_AUTH_JWT_SECRET environment variable
  access_ttl_ms: 900000
  refresh_ttl_ms: 604800000
  refresh_cookie_name: optikk_refresh
  cookie_domain: ""
  cookie_secure: false
  cookie_same_site: lax
