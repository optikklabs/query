environment: development

server:
  port: "19090"
  allowed_origins: "http://localhost:3000,http://localhost:5173"

mysql:
  host: "127.0.0.1"
  port: "13306"
  database: optikk
  user: root
  password: "localdev" # Overridable by OPTIKK_MYSQL_PASSWORD environment variable
  max_open_conns: 50
  max_idle_conns: 25

clickhouse:
  host: "127.0.0.1"
  port: "19000"
  database: optikk
  user: default
  password: "localdev" # Overridable by OPTIKK_CLICKHOUSE_PASSWORD environment variable
  secure: false
  # Per-pod pool; all replicas together should stay near CH's
  # max_concurrent_queries (default 100). 0 falls back to 40/20.
  max_open_conns: 40
  max_idle_conns: 20

# The evaluator consumes the same protobuf metrics stream produced by ingest.
# Enable only after Kafka is reachable from the query deployment.
alerting:
  kafka:
    enabled: false
    broker_list: "127.0.0.1:9092"
    topic_prefix: optikk.ingest
    consumer_group: optikk-query-alerting
    max_poll_records: 1000

auth:
  jwt_secret: "" # Use OPTIKK_AUTH_JWT_SECRET environment variable
  access_ttl_ms: 900000
  refresh_ttl_ms: 604800000
  refresh_cookie_name: optikk_refresh
  cookie_domain: ""
  cookie_secure: false
  cookie_same_site: lax

email:
  resend_verification_enabled: false # Use OPTIKK_EMAIL_RESEND_VERIFICATION_ENABLED
  resend_api_key: "" # Use OPTIKK_EMAIL_RESEND_API_KEY
  from: "" # Use OPTIKK_EMAIL_FROM
  verify_base_url: "" # Use OPTIKK_EMAIL_VERIFY_BASE_URL
